name: Deploy Ingress

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment name'
        type: string
        required: true
      tag:
        description: 'Repository tag to checkout (e.g. "v1.0.2")'
        type: string
        required: false
        default: ''

jobs:
  deploy_ingress:
    name: Deploy Ingress
    runs-on: [self-hosted, "run_id:${{ inputs.environment }}-${{ github.run_id }}"]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      NAMESPACE: ${{ secrets.NAMESPACE }}
      CONFIG_FILE: ${{ secrets.CONFIG_FILE }}
      ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update Kubeconfig
        id: update_kubeconfig
        run: |
          set -eo pipefail

          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Create Ingress (dev/dev-refactor)
        id: create_ingress_dev
        if: ${{ vars.NORM_ENV == 'dev' || vars.NORM_ENV == 'dev-refactor' }}
        run: |
          set -eo pipefail
          source $CONFIG_FILE
          source ./deployment_functions.sh

          if [[ ${{ vars.NORM_ENV }} = "dev-refactor" ]]; then
            export INGRESS_RULES_HOST="*.$DOMAIN_NAME"
            export INGRESS_RULES_ORDER=0

            export CANARY_INGRESS_RULES_HOST="$INGRESS_RULES_HOST"
            export CANARY_INGRESS_RULES_ORDER="$INGRESS_RULES_ORDER"

            createCanaryIngress

            export INGRESS_RULES_ORDER=1

            createIngress \
            $API_GATEWAY_SERVICE_NAME $API_GATEWAY_APPLICATION_PATH $BACKEND_SERVICE_PORT \
            $BACKEND_FOR_FRONTEND_SERVICE_NAME $BACKEND_FOR_FRONTEND_APPLICATION_PATH $BACKEND_SERVICE_PORT \
            $FRONTEND_SERVICE_NAME $FRONTEND_SERVICE_APPLICATION_PATH $FRONTEND_SERVICE_PORT


          elif [[ ${{ vars.NORM_ENV }} = "dev" ]]; then
            export INGRESS_RULES_HOST="*.$DOMAIN_NAME"
            export INGRESS_RULES_ORDER=2

            createIngress \
            $API_GATEWAY_SERVICE_NAME $API_GATEWAY_APPLICATION_PATH $BACKEND_SERVICE_PORT \
            $AUTHORIZATION_SERVER_SERVICE_NAME $AUTHORIZATION_SERVER_APPLICATION_PATH $BACKEND_SERVICE_PORT \
            $BACKEND_FOR_FRONTEND_SERVICE_NAME $BACKEND_FOR_FRONTEND_APPLICATION_PATH $BACKEND_SERVICE_PORT \
            $FRONTEND_SERVICE_NAME $FRONTEND_SERVICE_APPLICATION_PATH $FRONTEND_SERVICE_PORT
          fi

      - name: Create Ingress (auth-server canary, single namespace)
        id: create_ingress_canary
        if: ${{ vars.NORM_ENV == 'test' || vars.NORM_ENV == 'prod' || vars.NORM_ENV == 'att' || vars.NORM_ENV == 'qa' }}
        run: |
          set -eo pipefail
          source $CONFIG_FILE
          source ./deployment_functions.sh
      
          export INGRESS_RULES_HOST="*.$DOMAIN_NAME"
          export INGRESS_RULES_ORDER=0 
      
          export CANARY_INGRESS_RULES_HOST="$INGRESS_RULES_HOST"
          export CANARY_INGRESS_RULES_ORDER="$INGRESS_RULES_ORDER"
      
          createCanaryIngress
      
          export INGRESS_RULES_ORDER=1
      
          createIngress \
          $API_GATEWAY_SERVICE_NAME $API_GATEWAY_APPLICATION_PATH $BACKEND_SERVICE_PORT \
          $BACKEND_FOR_FRONTEND_SERVICE_NAME $BACKEND_FOR_FRONTEND_APPLICATION_PATH $BACKEND_SERVICE_PORT \
          $FRONTEND_SERVICE_NAME $FRONTEND_SERVICE_APPLICATION_PATH $FRONTEND_SERVICE_PORT
