apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{SERVICE_NAME}}
  namespace: {{NAMESPACE}}
spec:
  template:
    spec:
      containers:
        - name: {{SERVICE_NAME}}
          livenessProbe:
            httpGet:
              path: "/{{API_GATEWAY_APPLICATION_PATH}}/{{API_GATEWAY_INTERFACE_VERSION}}/status"
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: "/{{API_GATEWAY_APPLICATION_PATH}}/{{API_GATEWAY_INTERFACE_VERSION}}/status"
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          env:
            - name: ACCEPTED_AUDIENCES
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: ACCEPTED_AUDIENCES
            - name: AGREEMENT_PROCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: AGREEMENT_PROCESS_URL
            - name: AUTHORIZATION_PROCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: AUTHORIZATION_PROCESS_URL
            - name: CATALOG_PROCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: CATALOG_PROCESS_URL
            - name: PARTY_REGISTRY_PROXY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: PARTY_REGISTRY_PROXY_URL
            - name: ATTRIBUTE_REGISTRY_PROCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: ATTRIBUTE_REGISTRY_PROCESS_URL
            - name: PURPOSE_PROCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: PURPOSE_PROCESS_URL
            - name: TENANT_PROCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: TENANT_PROCESS_URL
            - name: NOTIFIER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: NOTIFIER_URL
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: BASE_URL
            - name: API_GATEWAY_INTERFACE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: API_GATEWAY_INTERFACE_VERSION
            - name: WELL_KNOWN_URLS
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: WELL_KNOWN_URLS
            - name: READMODEL_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: common-read-model
                  key: READMODEL_DB_HOST
            - name: READMODEL_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: common-read-model
                  key: READMODEL_DB_NAME
            - name: READMODEL_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: read-model
                  key: READONLY_USR
            - name: READMODEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: read-model
                  key: READONLY_PSW
            - name: READMODEL_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: common-read-model
                  key: READMODEL_DB_PORT
        - name: READMODEL_SQL_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: DB_HOST_RO
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: DB_NAME
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: DB_PORT
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_AGREEMENT
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_AGREEMENT
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_ATTRIBUTE
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_ATTRIBUTE
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_CATALOG
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_CATALOG
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_CLIENT
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_CLIENT
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_CLIENT_JWK_KEY
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_CLIENT_JWK_KEY
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_DELEGATION
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_DELEGATION
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_ESERVICE_TEMPLATE
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_ESERVICE_TEMPLATE
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_PRODUCER_JWK_KEY
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_PRODUCER_JWK_KEY
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_PRODUCER_KEYCHAIN
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_PRODUCER_KEYCHAIN
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_PURPOSE
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_PURPOSE
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_SCHEMA_TENANT
          valueFrom:
            configMapKeyRef:
              key: DB_SCHEMA_TENANT
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_USE_SSL
          valueFrom:
            configMapKeyRef:
              key: DB_USE_SSL
              name: common-read-model-sql
        - name: READMODEL_SQL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: platform-data-readonly-user
        - name: READMODEL_SQL_DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: platform-data-readonly-user