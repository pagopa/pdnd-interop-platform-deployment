apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{SERVICE_NAME}}
  namespace: {{NAMESPACE}}
spec:
  template:
    spec:
      containers:
        - name: {{SERVICE_NAME}}
          env:
            - name: EVENTSTORE_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: EVENTSTORE_DB_SCHEMA
            - name: WELL_KNOWN_URLS
              valueFrom:
                configMapKeyRef:
                  name: common-jwt
                  key: WELL_KNOWN_URLS
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: S3_BUCKET
            - name: ESERVICE_DOCUMENTS_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: ESERVICE_DOCUMENTS_PATH
            - name: PRODUCER_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: PRODUCER_ALLOWED_ORIGINS
            - name: ACCEPTED_AUDIENCES
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: ACCEPTED_AUDIENCES
            - name: FEATURE_FLAG_AGREEMENT_APPROVAL_POLICY_UPDATE
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: FEATURE_FLAG_AGREEMENT_APPROVAL_POLICY_UPDATE
        - name: READMODEL_SQL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: platform-data-catalog-process-user
        - name: READMODEL_SQL_DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: platform-data-catalog-process-user
