apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{SERVICE_NAME}}
  namespace: {{NAMESPACE}}
spec:
  template:
    spec:
      containers:
        - name: {{SERVICE_NAME}}
          env:
            - name: KAFKA_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: KAFKA_CLIENT_ID
            - name: KAFKA_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: KAFKA_GROUP_ID
            - name: ESERVICE_TEMPLATE_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: common-kafka
                  key: ESERVICE_TEMPLATE_TOPIC
            - name: CATALOG_PROCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: common-services-urls
                  key: CATALOG_PROCESS_URL
            - name: ESERVICE_TEMPLATE_PROCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: common-services-urls
                  key: ESERVICE_TEMPLATE_PROCESS_URL
            - name: ESERVICE_DOCUMENTS_CONTAINER
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: ESERVICE_DOCUMENTS_CONTAINER
            - name: ESERVICE_DOCUMENTS_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: ESERVICE_DOCUMENTS_PATH
            - name: INTERNAL_JWT_KID
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: INTERNAL_JWT_KID
            - name: INTERNAL_JWT_SECONDS_DURATION
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: INTERNAL_JWT_SECONDS_DURATION
            - name: INTERNAL_JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: INTERNAL_JWT_ISSUER
            - name: INTERNAL_JWT_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: INTERNAL_JWT_SUBJECT
            - name: INTERNAL_JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: {{SERVICE_NAME}}
                  key: INTERNAL_JWT_AUDIENCE
