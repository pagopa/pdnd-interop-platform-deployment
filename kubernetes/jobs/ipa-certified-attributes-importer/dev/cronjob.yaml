apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: {{SERVICE_NAME}}
  name: {{SERVICE_NAME}}
  namespace: {{NAMESPACE}}
spec:
  schedule: "30 7 * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 0
  jobTemplate:
    metadata:
      labels:
        app: {{SERVICE_NAME}}
      annotations:
        digest: {{IMAGE_DIGEST}} # Used to force deployment on same image version but different content
    spec:
      template:
        metadata:
          labels:
            app: {{SERVICE_NAME}}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{SERVICE_NAME}}
          containers:
            - name: {{SERVICE_NAME}}
              image: {{REPOSITORY}}/{{SERVICE_NAME}}:{{JOB_IPA_CERTIFIED_ATTRIBUTES_IMPORTER_IMAGE_VERSION}}
              imagePullPolicy: Always
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: READ_MODEL_DB_HOST
                  value: "{{READ_MODEL_DB_HOST}}"
                - name: READ_MODEL_DB_PORT
                  value: "{{READ_MODEL_DB_PORT}}"
                - name: READ_MODEL_DB_NAME
                  value: "{{READ_MODEL_DB_NAME}}"
                - name: MONGODB_REPLICA_SET
                  value: "{{READ_MODEL_REPLICA_SET}}"
                - name: MONGODB_READ_PREFERENCE
                  value: "{{READ_MODEL_READ_PREFERENCE}}"
                - name: READ_MODEL_DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: documentdb
                      key: READONLY_USR
                - name: READ_MODEL_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: documentdb
                      key: READONLY_PSW

                - name: TENANT_PROCESS_URL
                  valueFrom:
                      configMapKeyRef:
                        name: common-services-urls
                        key: TENANT_PROCESS_URL
                - name: ATTRIBUTE_REGISTRY_PROCESS_URL
                  valueFrom:
                    configMapKeyRef:
                      name: common-services-urls
                      key: ATTRIBUTE_REGISTRY_PROCESS_URL

                - name: INTERNAL_JWT_KID
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: INTERNAL_JWT_KID
                - name: INTERNAL_JWT_SUBJECT
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: INTERNAL_JWT_SUBJECT
                - name: INTERNAL_JWT_ISSUER
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: INTERNAL_JWT_ISSUER
                - name: INTERNAL_JWT_AUDIENCE
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: INTERNAL_JWT_AUDIENCE
                - name: INTERNAL_JWT_SECONDS_DURATION
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: INTERNAL_JWT_SECONDS_DURATION

                - name: INSTITUTIONS_URL
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: INSTITUTIONS_URL
                - name: AOO_URL
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: AOO_URL
                - name: UO_URL
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: UO_URL
                - name: INSTITUTIONS_CATEGORIES_URL
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: INSTITUTIONS_CATEGORIES_URL
                - name: ATTRIBUTE_CREATION_WAIT_TIME
                  valueFrom:
                    configMapKeyRef:
                      name: {{SERVICE_NAME}}
                      key: ATTRIBUTE_CREATION_WAIT_TIME

              resources:
                requests:
                  cpu: "{{SERVICE_RESOURCE_CPU}}"
                  memory: "{{SERVICE_RESOURCE_MEM}}"
                limits:
                  cpu: "{{SERVICE_RESOURCE_CPU}}"
                  memory: "{{SERVICE_RESOURCE_MEM}}"
